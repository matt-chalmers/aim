[pytest]
# The harness suite is deliberately APPLICATION-FREE. It asserts on this repo's own
# files — the scripts a worker runs, the prompts that tell it to, the docs that
# describe them — and never imports the project being worked on, so it needs no
# database and no framework settings. That separation is the point: an application
# test run should not be gated on harness hygiene, and a harness change should not
# wait on the application suite.
#
# Run it with `make test` (or `cd harness && uv run pytest`). Dependencies come from
# harness/pyproject.toml, which uv resolves — the harness owns its own small set
# rather than borrowing one from the project it happens to be installed in, because
# as a plugin there is no such project to borrow from.
testpaths = tests
python_files = test_*.py
# harness/ on sys.path so tests import the model runtime directly (`models.resolve`)
# rather than shelling out to it — the point of it being real modules.
pythonpath = .
# `conformance` marks the shared TaskStore contract, which drives a REAL tracker in
# a scratch workspace rather than a mock. Deselect it with `-m 'not conformance'`
# when the backend's binary is unavailable; CI runs it, because an adapter agreeing
# with its author's assumptions about a CLI is not evidence that the CLI agrees.
markers =
    conformance: the shared TaskStore contract, run against every shipped backend
# The conformance contract drives a REAL tracker binary, and `bd`'s per-invocation
# startup makes it ~40s where the rest of this suite is about a second. It is therefore
# NOT in the default run — `pytest.ini` above states that a fast, application-free suite
# is the point, and a four-minute one gets skipped by the people it was written for.
#
# It is not optional, it is RELOCATED: `make conformance` runs it, and CI runs it on every
# push. Deselecting it here is a statement about WHEN it runs, not whether. If you change
# the adapter, run `make conformance` before believing the fast suite.
addopts = --strict-markers -q -m "not conformance"
